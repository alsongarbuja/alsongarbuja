<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Animated pixel-art scene: a character runs, jumps over a slime and collects coins while passion bars fill to MAX" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Game dev passion</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1535"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <pattern id="tiles" x="0" y="220" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#1e293b"/>
      <rect width="40" height="8" fill="#2dd4bf"/>
      <rect y="8" width="40" height="4" fill="#14917f"/>
      <rect x="0" y="12" width="2" height="28" fill="#0f172a"/>
      <rect x="20" y="26" width="20" height="2" fill="#0f172a"/>
    </pattern>
    <pattern id="seg" x="0" y="0" width="13" height="12" patternUnits="userSpaceOnUse">
      <rect x="11" width="2" height="12" fill="#0b1020"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="260" rx="16"/></clipPath>
    <g id="heart">
      <rect x="3" y="0" width="6" height="3" fill="#ff4d6d"/>
      <rect x="12" y="0" width="6" height="3" fill="#ff4d6d"/>
      <rect x="0" y="3" width="21" height="6" fill="#ff4d6d"/>
      <rect x="3" y="9" width="15" height="3" fill="#ff4d6d"/>
      <rect x="6" y="12" width="9" height="3" fill="#ff4d6d"/>
      <rect x="9" y="15" width="3" height="3" fill="#ff4d6d"/>
      <rect x="3" y="3" width="3" height="3" fill="#ffc2cf"/>
    </g>
  </defs>

  <style>
    .mono{font-family:'Courier New',Courier,monospace;font-weight:700}
    @keyframes scroll{to{transform:translateX(-40px)}}
    .ground{animation:scroll .5s linear infinite}
    @keyframes run{from{transform:translateX(960px)}to{transform:translateX(-80px)}}
    .run{animation:run 6s linear infinite}
    @keyframes jump{
      0%,72%{transform:translateY(0);animation-timing-function:ease-out}
      79%{transform:translateY(-62px);animation-timing-function:ease-in}
      86%,100%{transform:translateY(0)}
    }
    .jump{animation:jump 6s linear infinite}
    @keyframes la{0%,49.9%{opacity:1}50%,100%{opacity:0}}
    @keyframes lb{0%,49.9%{opacity:0}50%,100%{opacity:1}}
    .la{animation:la .36s linear infinite}
    .lb{animation:lb .36s linear infinite}
    @keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2)}}
    .spin{animation:spin .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes wob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.88)}}
    .wob{animation:wob .5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
    @keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
    .hb{animation:hb 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .tw{animation:tw 2.4s ease-in-out infinite}
    @keyframes puff{0%{opacity:.7;transform:translate(0,0)}100%{opacity:0;transform:translate(-22px,-8px)}}
    .puff{animation:puff .6s linear infinite}
    @keyframes nice{
      0%,85%{opacity:0;transform:translateY(0)}
      88%{opacity:1}
      96%{opacity:1;transform:translateY(-14px)}
      100%{opacity:0;transform:translateY(-14px)}
    }
    .nice{animation:nice 6s linear infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .blink{animation:blink 1.2s steps(1) infinite}
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fff">
      <rect class="tw" x="60"  y="30"  width="2" height="2"/>
      <rect class="tw" x="210" y="22"  width="2" height="2" style="animation-delay:.6s"/>
      <rect class="tw" x="470" y="40"  width="3" height="3" style="animation-delay:1.1s"/>
      <rect class="tw" x="540" y="18"  width="2" height="2" style="animation-delay:.3s"/>
      <rect class="tw" x="620" y="30"  width="2" height="2" style="animation-delay:1.7s"/>
      <rect class="tw" x="700" y="14"  width="3" height="3" style="animation-delay:.9s"/>
      <rect class="tw" x="790" y="26"  width="2" height="2" style="animation-delay:1.4s"/>
      <rect class="tw" x="860" y="50"  width="2" height="2" style="animation-delay:.2s"/>
      <rect class="tw" x="450" y="120" width="2" height="2" style="animation-delay:1.9s"/>
      <rect class="tw" x="880" y="140" width="2" height="2" style="animation-delay:.7s"/>
    </g>

    <!-- mountains -->
    <polygon points="0,220 0,190 70,150 130,192 210,140 300,196 400,156 480,200 560,150 650,196 740,146 830,190 900,160 900,220" fill="#151a33"/>
    <polygon points="0,220 0,205 90,178 180,208 280,172 380,210 500,180 600,210 720,176 820,208 900,186 900,220" fill="#1a2040"/>

    <!-- hearts -->
    <g transform="translate(30,14)"><g class="hb"><use href="#heart"/></g></g>
    <g transform="translate(58,14)"><g class="hb" style="animation-delay:.2s"><use href="#heart"/></g></g>
    <g transform="translate(86,14)"><g class="hb" style="animation-delay:.4s"><use href="#heart"/></g></g>

    <!-- passion bars -->
    <g class="mono" font-size="12" fill="#cbd5e1">
      <text x="30" y="54">STORYTELLING</text>
      <text x="30" y="80">GAME FEEL</text>
      <text x="30" y="106">WORLD BUILDING</text>
    </g>
    <g>
      <rect x="170" y="44" width="260" height="12" fill="#111936" stroke="#334155"/>
      <rect x="170" y="44" width="0" height="12" fill="#ff4d6d">
        <animate attributeName="width" values="0;260;260;0" keyTimes="0;0.35;0.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="170" y="44" width="260" height="12" fill="url(#seg)"/>

      <rect x="170" y="70" width="260" height="12" fill="#111936" stroke="#334155"/>
      <rect x="170" y="70" width="0" height="12" fill="#ffd166">
        <animate attributeName="width" values="0;260;260;0" keyTimes="0;0.35;0.9;1" dur="6s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="170" y="70" width="260" height="12" fill="url(#seg)"/>

      <rect x="170" y="96" width="260" height="12" fill="#111936" stroke="#334155"/>
      <rect x="170" y="96" width="0" height="12" fill="#2dd4bf">
        <animate attributeName="width" values="0;260;260;0" keyTimes="0;0.35;0.9;1" dur="6s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="170" y="96" width="260" height="12" fill="url(#seg)"/>
    </g>
    <g class="mono" font-size="12" fill="#ffd166">
      <text x="442" y="54" opacity="0">MAX
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.36;0.92;1" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="442" y="80" opacity="0">MAX
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.36;0.92;1" dur="6s" begin="0.4s" repeatCount="indefinite"/>
      </text>
      <text x="442" y="106" opacity="0">MAX
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.36;0.92;1" dur="6s" begin="0.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- title -->
    <g class="mono" text-anchor="end">
      <text x="870" y="78" font-size="46" fill="url(#ttl)">GAME DEV</text>
      <text x="870" y="102" font-size="13" fill="#94a3b8">PASSION LEVEL: ∞</text>
      <g class="blink"><polygon points="766,118 766,130 776,124" fill="#ffd166"/><text x="870" y="128" font-size="13" fill="#ffd166">PRESS START</text></g>
    </g>

    <!-- ground -->
    <rect class="ground" x="0" y="220" width="940" height="40" fill="url(#tiles)"/>

    <!-- coins -->
    <g transform="translate(-88,0)">
      <g class="run">
        <g transform="translate(0,150)"><g class="spin"><circle r="9" fill="#ffd166" stroke="#f59e0b" stroke-width="2"/><rect x="-2" y="-5" width="4" height="10" fill="#f59e0b"/></g></g>
        <g transform="translate(50,132)"><g class="spin" style="animation-delay:.15s"><circle r="9" fill="#ffd166" stroke="#f59e0b" stroke-width="2"/><rect x="-2" y="-5" width="4" height="10" fill="#f59e0b"/></g></g>
        <g transform="translate(100,124)"><g class="spin" style="animation-delay:.3s"><circle r="9" fill="#ffd166" stroke="#f59e0b" stroke-width="2"/><rect x="-2" y="-5" width="4" height="10" fill="#f59e0b"/></g></g>
        <g transform="translate(150,132)"><g class="spin" style="animation-delay:.45s"><circle r="9" fill="#ffd166" stroke="#f59e0b" stroke-width="2"/><rect x="-2" y="-5" width="4" height="10" fill="#f59e0b"/></g></g>
        <g transform="translate(200,150)"><g class="spin" style="animation-delay:.6s"><circle r="9" fill="#ffd166" stroke="#f59e0b" stroke-width="2"/><rect x="-2" y="-5" width="4" height="10" fill="#f59e0b"/></g></g>
      </g>
    </g>

    <!-- enemy slime -->
    <g transform="translate(0,192)">
      <g class="run">
        <g class="wob">
          <rect x="8" y="0" width="12" height="4" fill="#a855f7"/>
          <rect x="4" y="4" width="20" height="4" fill="#a855f7"/>
          <rect x="0" y="8" width="28" height="20" fill="#a855f7"/>
          <rect x="0" y="24" width="28" height="4" fill="#7e22ce"/>
          <rect x="6" y="10" width="6" height="6" fill="#fff"/>
          <rect x="16" y="10" width="6" height="6" fill="#fff"/>
          <rect x="6" y="12" width="2" height="4" fill="#111"/>
          <rect x="16" y="12" width="2" height="4" fill="#111"/>
        </g>
      </g>
    </g>

    <!-- dust -->
    <g fill="#94a3b8">
      <rect class="puff" x="128" y="214" width="6" height="6"/>
      <rect class="puff" x="128" y="214" width="4" height="4" style="animation-delay:.2s"/>
      <rect class="puff" x="128" y="214" width="5" height="5" style="animation-delay:.4s"/>
    </g>

    <!-- player -->
    <g transform="translate(130,172)">
      <g class="jump">
        <!-- cap -->
        <rect x="8" y="0" width="20" height="4" fill="#ef4444"/>
        <rect x="4" y="4" width="28" height="4" fill="#ef4444"/>
        <rect x="32" y="4" width="8" height="4" fill="#b91c1c"/>
        <!-- hair -->
        <rect x="4" y="8" width="4" height="8" fill="#7c2d12"/>
        <!-- face -->
        <rect x="8" y="8" width="24" height="12" fill="#fcd9b6"/>
        <rect x="16" y="12" width="4" height="4" fill="#111"/>
        <rect x="26" y="12" width="4" height="4" fill="#111"/>
        <!-- body -->
        <rect x="8" y="20" width="24" height="16" fill="#38bdf8"/>
        <rect x="8" y="30" width="24" height="4" fill="#0c4a6e"/>
        <rect x="4" y="22" width="4" height="10" fill="#38bdf8"/>
        <rect x="4" y="32" width="4" height="4" fill="#fcd9b6"/>
        <!-- legs frame A -->
        <g class="la">
          <rect x="8" y="36" width="10" height="8" fill="#1e3a8a"/>
          <rect x="6" y="44" width="14" height="4" fill="#78350f"/>
          <rect x="22" y="36" width="10" height="6" fill="#1e3a8a"/>
          <rect x="24" y="40" width="12" height="4" fill="#78350f"/>
        </g>
        <!-- legs frame B -->
        <g class="lb">
          <rect x="22" y="36" width="10" height="8" fill="#1e3a8a"/>
          <rect x="20" y="44" width="14" height="4" fill="#78350f"/>
          <rect x="8" y="36" width="10" height="6" fill="#1e3a8a"/>
          <rect x="8" y="40" width="12" height="4" fill="#78350f"/>
        </g>
      </g>
    </g>

    <!-- combo pop -->
    <text class="mono nice" x="235" y="170" font-size="16" fill="#ffd166" text-anchor="middle">+300 NICE!</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="259" rx="16" fill="none" stroke="#30363d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
